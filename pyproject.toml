[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-doctor"
version = "0.1.0"
description = "Local research inference for RSNA knee MRI and BrainIAC MCI/IDH"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20",
  "torch>=2.7,<3", "torchvision>=0.22,<1", "timm>=1.0.3,<2",
  "monai==1.5.1", "einops>=0.8,<1", "safetensors>=0.5,<1",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "pydicom>=3,<4",
  "nibabel>=5.3,<6", "pillow>=10,<13", "PyYAML>=6,<7", "requests>=2.32,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
dicom-codecs = ["pylibjpeg>=2,<3", "pylibjpeg-libjpeg>=2,<3", "pylibjpeg-openjpeg>=2,<3"]
descriptions = ["mlx-vlm==0.3.9", "mlx-lm==0.28.3", "transformers>=4.57,<5", "huggingface-hub>=0.34,<1"]

[tool.setuptools.packages.find]
include = ["mri_doctor*"]

[tool.setuptools.package-data]
mri_doctor = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
